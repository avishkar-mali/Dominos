<app-header></app-header>

<div>
  <ul>
    <li class="nav-item">
      <a routerLink="/customer" routerLinkActive="active" class="nav-link">Customer List</a>
    </li>
    <li class="nav-item">
      <a routerLink="/create-customer" routerLinkActive="active" class="nav-link">Add Customer</a>
    </li>
  </ul>
</div>

<h3>Customer List</h3>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Customer ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Email</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let c of customers">
            <td>{{c.customerId}}</td>
            <td>{{c.firstName}}</td>
            <td>{{c.lastName}}</td>
            <td>{{c.age}}</td>
            <td>{{c.gender}}</td>
            <td>{{c.email}}</td>
        </tr>
    </tbody>
</table>

<app-footer></app-footer>
